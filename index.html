<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgeon Kernel alpha 0.1</title>

    <!-- Слои стилей: BIOS -> бутлоадер -> ядро -> GUI. -->
    <link rel="stylesheet" href="bios/post/post.css">
    <link rel="stylesheet" href="bios/click-bios/click-bios.css">
    <link rel="stylesheet" href="boot/bootloader/bootloader.css">
    <link rel="stylesheet" href="core/kernel.css">
    <link rel="stylesheet" href="core/gui.css">

    <!-- Модули. defer держит порядок исполнения. -->
    <script src="system/config.js" defer></script>
    <script src="system/keyboard.js" defer></script>
    <script src="system/mouse.js" defer></script>
    <script src="bios/post/post.js" defer></script>
    <script src="bios/click-bios/click-bios.js" defer></script>
    <script src="boot/bootloader/bootloader.js" defer></script>
    <script src="core/os_core.js" defer></script>
    <script src="core/os_recovery.js" defer></script>
    <script src="drivers/driver_manager.js" defer></script>
    <script src="net/net_stack.js" defer></script>
    <script src="net/tpabka_pkg.js" defer></script>

    <!-- Каркас монитора: на весь экран. -->
    <!-- Курсор: своей стрелки ядро не рисует — на экране системный (браузерный)
         курсор. Указатель держит драйвер: пока в NVRAM нет пака PS/2-мыши, его
         нет ни в меню загрузки, ни в консоли ядра; консоль получает курсор в
         готовом shell (system/mouse.js вешает на живой слой класс .sv-pointer).
         В BIOS Setup мышь есть всегда — она там прошивочная. POST, экран загрузки
         системы и панель указателя не получают, поэтому по умолчанию он спрятан. -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            cursor: none;
        }

        #surgeon-monitor {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }
    </style>
</head>
<body>

    <!-- Монитор: полноэкранный контейнер, внутри три слоя. -->
    <div id="surgeon-monitor">

        <!-- Слой 1 — GRUB, сюда бутлоадер рисует меню. Погашен до init(). Меню с
             мышью: указатель держит драйвер PS/2 из NVRAM — как и в консоли
             ядра (system/mouse.js), а прошивка лишь отдаёт мышь legacy-коду
             (Legacy USB Support). -->
        <div id="surgeon-grub" style="display: none;"></div>

        <!-- Слой 2 — текстовая консоль ядра: логи и командная строка. -->
        <div id="surgeon-terminal" style="display: none;"></div>

        <!-- Слой 3 — графическая оболочка. -->
        <div id="surgeon-desktop" style="display: none;"></div>

    </div>

    <!-- Оркестратор: POST -> лого -> (<Del> x5: Click BIOS) -> бутлоадер -> ядро. -->
    <script>
        (function () {
            'use strict';

            /* Шаг 1: прошивка. Дальше BIOS и бутлоадер вызовут себя сами. */
            function startBios() {
                if (window.SurgeonPost && typeof window.SurgeonPost.init === 'function') {
                    window.SurgeonPost.init();
                } else {
                    console.error('Критическая ошибка: модуль POST не обнаружен! Грузимся без BIOS.');
                    window.SurgeonDiskReady = true;   // сканировать диск больше некому
                    startBootloader();
                }
            }

            /* Предохранитель: BIOS молчит — считаем диск готовым сами. */
            var DISK_READY_TIMEOUT = 1500;
            var bootStarted = false;

            /* Шаг 2: меню GRUB. BIOS даёт зелёный свет флагом SurgeonDiskReady. */
            function startBootloader() {
                if (bootStarted) { return; }

                if (window.SurgeonDiskReady !== true) {
                    console.warn('GRUB: диск не готов (SurgeonDiskReady !== true), ждём сигнал BIOS.');
                    document.addEventListener('surgeon_disk_ready', startBootloader, false);
                    window.setTimeout(startBootloader, DISK_READY_TIMEOUT);
                    return;
                }

                bootStarted = true;

                if (window.SurgeonBoot && typeof window.SurgeonBoot.init === 'function') {
                    window.SurgeonBoot.init();
                } else {
                    console.error('Критическая ошибка: бутлоадер Surgeon Kernel не обнаружен!');
                }
            }

            /* Шаг 3: параметры, которые бутлоадер отдаёт после выбора. */
            document.addEventListener('boot_complete', function (e) {
                console.log('Ядро получило параметры загрузки:', e.detail);
                // Ядро слушает boot_complete само: core/os_core.js поднимает консоль
            });

            document.addEventListener('bios_complete', startBootloader);
            document.addEventListener('DOMContentLoaded', startBios);
        })();
    </script>

</body>
</html>
